name: Run PyTest
on:
  pull_request:
    branches: ['main']

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DB_USER: 'postgres'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run PyTest
        run: pytest
      
      - name: Failure Log
        if: failure()
        run: echo "1つ前のstepが失敗しました"

      - name: Print DB_USER
        run: echo "DB_USER -> ${DB_USER}"

      - name: Print secrets
        run: echo "DUMMY_API_KEY -> ${{ secrets.DUMMY_API_KEY}}"
      
      - name: Get time
        id: get_time
        run: echo "time=$(date)" >> $GITHUB_OUTPUT

      - name: Print github output
        run:  echo "1つ前のstepで取得した時間 -> ${{ steps.get_time.outputs.time }}"
